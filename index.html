<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Beats by Dre</title>
</head>
<body>
    <section id ="container">
        <div id="nav-bar">
            <div id ="logo">
                <img src ="/assets/imgi_2_beats-logo-161616.png" alt = "logo" width="100%" height="40px" object-fit="cover">
            </div>
            <div id = "nav-links">
                <a>Shop</a>
                <a class="pink-text">
                    Gift Guide
                    <img src="assets/gift-no-color.png" alt="Icon description" width="20" height="20" class="pink-icon">
                </a> 
                <a>Support</a>
            </div>
            <div id ="search-brief">
                <img src="assets/search.png" alt="Search Icon" width="20" height="20">
                <img src="assets/imgi_34_default.png" alt="Cart Icon" width="20" height="20">
            </div>
        </div>
        <div id ="Hero-section">
            <img src="assets/imgi_3_hp-hero-beats-360-kendall.jpg.large.2x.png" alt="Hero Image" width="100%" height="100%">
            <div id = "hero-text">
                <h3>Kendall Jenner</h3>
                <h2> Beats 360</h2>
                <p> One headphone. Every version of you.1</p>
            </div>
            <div id = "hero-buttons">
                <button> Shop Now</button>
                <button> Customize </button>
            </div>
        </div>
    </section>
</body>
</html>
